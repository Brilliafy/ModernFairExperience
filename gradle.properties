# This file is used for Gradle options, for the rest use stonecutter.properties.toml
org.gradle.jvmargs=-Xmx2G

# Build one thing at a time. Stonecutter itself only builds the active version
# unless you explicitly ask for another project, and this keeps Gradle from
# running the version/loader matrix in parallel.
org.gradle.parallel=false
org.gradle.workers.max=1

# No lingering Gradle daemons eating RAM between builds.
org.gradle.daemon=false
