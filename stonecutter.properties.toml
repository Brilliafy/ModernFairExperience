# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "fairexperience"
mod.name = "Fair Experience"
mod.group = "com.brilliafy.fairexperience"
mod.version = "2.0.0"

deps.fabric_loader = "0.19.5"

# Fill these in with the real project ids/slugs before tagging a release.
publish.modrinth_id = "REPLACE_WITH_MODRINTH_PROJECT_ID"
publish.curseforge_id = "REPLACE_WITH_CURSEFORGE_PROJECT_ID"
publish.curseforge_slug = "fair-experience"
publish.github_repo = "Brilliafy/ModernFairExperience"
loomx.loom_version = "1.18-SNAPSHOT"

["1.20.1"]
# List of releases to be marked compatible on Modrinth/Curseforge
mod.mc_releases = ["1.20", "1.20.1"]


[fabric."1.20.1"]
# Mod compatibility range in fabric.mod.json/neoforge.mods.toml
mod.mc_compat = ">=1.20 <=1.20.1"
deps.fabric_api = "0.92.12+1.20.1"

[forge."1.20.1"]
mod.mc_compat = "[1.20, 1.20.1]"
deps.forge_loader = "47.4.26"


["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]


[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
deps.fabric_api = "0.116.17+1.21.1"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.1]"
deps.neo_loader = "21.1.259"


["26.3"]
mod.mc_releases = ["26.3"]


[fabric."indev"]
# Only used by the never-built `indev-fabric` node that keeps `stonecutter active` off the
# release matrix. Values mirror the newest supported version.
mod.mc_compat = "~26.3"
deps.fabric_api = "0.162.0+26.3"


[fabric."26.3"]
mod.mc_compat = "~26.3"
deps.fabric_api = "0.162.0+26.3"

[neoforge."26.3"]
mod.mc_compat = "[26.3, 26.4)"
deps.neo_loader = "26.3.0.76"
